<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Title</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <a href="../index.html" class="logo">
            Nicolas Delgado
        </a>

        <div class="nav-links">

            <a href="../index.html#projects">
                Showcase
            </a>

            <a href="../projects.html">
                All Projects
            </a>

            <a href="../about.html#about">
                About
            </a>


        </div>

    </nav>

</header>

<main>

    <!-- =========================
         PROJECT HEADER
    ========================== -->

    <section class="section project-detail">

        <p class="eyebrow">
            FINAL PROJECT
        </p>

        <h1>
            Title
        </h1>

        <p class="project-detail-subtitle">
            One sentence here
        </p>

    <!-- =========================
        PROJECT Media Gallery
    ========================== -->
<section class="project-gallery" aria-label="Project media gallery">

    <div class="gallery-main">

        <!-- Previous slide -->
        <button class="gallery-arrow gallery-prev"
                type="button"
                aria-label="Previous slide">
            &#10094;
        </button>

        <!-- SLIDE 1: IMAGE -->
        <div class="gallery-slide active"
             data-type="image">

            <img
                src="images/tje-demo/screenshot-1.jpg"
                alt="TJE Demo gameplay screenshot"
                class="gallery-image"
            >

        </div>

        <!-- SLIDE 2: IMAGE -->
        <div class="gallery-slide"
             data-type="image">

            <img
                src="images/tje-demo/screenshot-2.jpg"
                alt="TJE Demo additional gameplay screenshot"
                class="gallery-image"
            >

        </div>

        <!-- SLIDE 3: YOUTUBE VIDEO -->
        <div class="gallery-slide"
             data-type="video"
             data-video-id="YOUR_YOUTUBE_VIDEO_ID">

            <button class="video-preview" type="button"
                    aria-label="Play TJE Demo video">

                <img
                    src="https://img.youtube.com/vi/YOUR_YOUTUBE_VIDEO_ID/hqdefault.jpg"
                    alt="TJE Demo video preview"
                >

                <span class="video-play-button">&#9654;</span>

            </button>

        </div>

        <!-- SLIDE 4: IMAGE -->
        <div class="gallery-slide"
             data-type="image">

            <img
                src="images/tje-demo/screenshot-3.jpg"
                alt="TJE Demo final screenshot"
                class="gallery-image"
            >

        </div>

        <!-- Next slide -->
        <button class="gallery-arrow gallery-next"
                type="button"
                aria-label="Next slide">
            &#10095;
        </button>

        <!-- Slide counter -->
        <span class="gallery-counter" aria-live="polite">
            1 / 4
        </span>

    </div>


    <!-- THUMBNAILS -->
    <div class="gallery-thumbnails"
         aria-label="Choose a gallery slide">

        <button class="gallery-thumb active"
                type="button"
                aria-label="View screenshot 1">
            <img src="images/tje-demo/screenshot-1.jpg"
                 alt="">
        </button>

        <button class="gallery-thumb"
                type="button"
                aria-label="View screenshot 2">
            <img src="images/tje-demo/screenshot-2.jpg"
                 alt="">
        </button>

        <button class="gallery-thumb video-thumb"
                type="button"
                aria-label="View video slide">

            <img
                src="https://img.youtube.com/vi/YOUR_YOUTUBE_VIDEO_ID/mqdefault.jpg"
                alt=""
            >

            <span>&#9654; VIDEO</span>

        </button>

        <button class="gallery-thumb"
                type="button"
                aria-label="View screenshot 3">
            <img src="images/tje-demo/screenshot-3.jpg"
                 alt="">
        </button>

    </div>

</section>

        <!-- =========================
             Core Features
        ========================== -->

        <div class="detail-section">

            <h2>
                Features
            </h2>

            <p>
                The primary gameplay mechanics and systems.
            </p>

        </div>

        <!-- =========================
             UTILIZED SKILLS & MECHANICS
        ========================== -->

        <div class="detail-section">

            <p class="eyebrow">
                UTILIZED SKILLS & MECHANICS
            </p>

            <div class="tags">

                <span>GDScript</span>
                <span>Horror</span>
                <span>Puzzle</span>

            </div>

        </div>

        <div class="view-more-wrapper">

            <a
                href="../projects.html"
                class="button secondary"
            >
                Back to All Projects
            </a>

        </div>

    </section>

</main>

<footer>

    <p>
        © 2026 Nicolas Delgado. Built with HTML & CSS.
    </p>

</footer>
<script src="../gallery.js"></script>
</body>
</html>
